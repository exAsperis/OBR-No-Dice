<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="No Dice">
  <!-- Orthographic projection of a regular icosahedron. Its vertices are
       permutations of (0, +/-1, +/-phi), where phi=(1+sqrt(5))/2;
       every 3D edge has length 2. Scale is 15 and center is (32,32). -->
  <g fill="none" stroke="#4da3ff" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2" d="M32 7.729 56.271 17 56.271 47 32 56.271 7.729 47 7.729 17Z
      M32 7.729 17 32 47 32 32 7.729
      M7.729 17 17 32 7.729 47
      M56.271 17 47 32 56.271 47
      M17 32 32 56.271 47 32"/>
    <path stroke-width="4.2" d="M12 58 52 6"/>
  </g>
</svg>
